spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/motodigo_core
    username: motodigo
    password: motodigo
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true

server:
  port: 8081

motodigo:
  auth:
    jwt-secret: ${JWT_SECRET:change-me-to-at-least-32-bytes-for-hs256}
  otp:
    provider: ${OTP_PROVIDER:log}
    pepper: ${OTP_PEPPER:change-me-otp-pepper}
  kyc:
    storage:
      endpoint: ${KYC_STORAGE_ENDPOINT:http://localhost:9000}
      access-key: ${KYC_STORAGE_ACCESS_KEY:minioadmin}
      secret-key: ${KYC_STORAGE_SECRET_KEY:minioadmin}
    encryption:
      active-key-id: ${KYC_ENCRYPTION_ACTIVE_KEY_ID:local}
      keys:
        local: ${KYC_ENCRYPTION_KEYS_LOCAL:bW90b2RpZ28tbG9jYWwta3ljLWtleS0zMi1ieXRlISE=}
        prod: ${KYC_ENCRYPTION_KEYS_PROD:}
    checksum-pepper: ${KYC_CHECKSUM_PEPPER:change-me-kyc-checksum-pepper}
  gis:
    routes-yaounde-path: ${GIS_ROUTES_YAOUNDE_PATH:./data/gis/routes_yaounde.gpkg}
