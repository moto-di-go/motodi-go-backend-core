spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/motodigo_core
    username: motodigo
    password: motodigo
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true

server:
  port: 8081

motodigo:
  gis:
    routes-yaounde-path: ${GIS_ROUTES_YAOUNDE_PATH:./data/gis/routes_yaounde.gpkg}
